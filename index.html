<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ハイテンポ英単語クイズ - Section 11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ==================== テーマ別カラー定義 ==================== */
        :root,
        [data-theme="light"] {
            --bg-main: #F6F5F0;
            --bg-card: #FFFFFF;
            --bg-subtle: #EFEDE6;
            --bg-hover: #F2F0E8;
            --text-main: #2B2E34;
            --text-sub: #646B75;
            --border-color: #E2DFD5;
            --border-strong: #C9C5B8;
            --accent-color: #B45309;      /* 落ち着いたアンバー */
            --accent-bg: #FEF3C7;
            --primary-btn-bg: #2B2E34;
            --primary-btn-text: #FFFFFF;
            --primary-btn-hover: #3F444D;
            --mark-bg: #FEF08A;           /* ソフトなイエローマーカー */
            --mark-text: #1F2937;
            --correct-bg: #DCFCE7;
            --correct-border: #15803D;
            --correct-text: #14532D;
            --wrong-bg: #FEE2E2;
            --wrong-border: #B91C1C;
            --wrong-text: #7F1D1D;
            --record-bg: #FEF9C3;
            --record-border: #D97706;
            --shadow-card: 0 2px 10px rgba(43, 46, 52, 0.05);
        }

        [data-theme="sepia"] {
            --bg-main: #F4ECD8;
            --bg-card: #FCF8EE;
            --bg-subtle: #EAE0C8;
            --bg-hover: #EFE6D0;
            --text-main: #3B3126;
            --text-sub: #736452;
            --border-color: #DFD3B8;
            --border-strong: #C4B494;
            --accent-color: #9A3412;
            --accent-bg: #FDE68A;
            --primary-btn-bg: #4A3B2C;
            --primary-btn-text: #FCF8EE;
            --primary-btn-hover: #5E4B38;
            --mark-bg: #FDE047;
            --mark-text: #2C2219;
            --correct-bg: #DCFCE7;
            --correct-border: #15803D;
            --correct-text: #14532D;
            --wrong-bg: #FEE2E2;
            --wrong-border: #B91C1C;
            --wrong-text: #7F1D1D;
            --record-bg: #FEF08A;
            --record-border: #B45309;
            --shadow-card: 0 2px 10px rgba(59, 49, 38, 0.06);
        }

        [data-theme="dark"] {
            --bg-main: #1E2028;
            --bg-card: #282B36;
            --bg-subtle: #313543;
            --bg-hover: #363A4A;
            --text-main: #E4E6EC;
            --text-sub: #9CA3B2;
            --border-color: #3A3E4D;
            --border-strong: #555B70;
            --accent-color: #FBBF24;
            --accent-bg: #423519;
            --primary-btn-bg: #E4E6EC;
            --primary-btn-text: #1E2028;
            --primary-btn-hover: #FFFFFF;
            --mark-bg: #FEF08A;
            --mark-text: #1F2937;
            --correct-bg: #143624;
            --correct-border: #22C55E;
            --correct-text: #DCFCE7;
            --wrong-bg: #3F191C;
            --wrong-border: #EF4444;
            --wrong-text: #FEE2E2;
            --record-bg: #3D3319;
            --record-border: #F59E0B;
            --shadow-card: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        /* ==================== ベーススタイル ==================== */
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .card-surface {
            background-color: var(--bg-card);
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-card);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .text-sub {
            color: var(--text-sub);
        }

        .text-accent {
            color: var(--accent-color);
        }

        .primary-btn {
            background-color: var(--primary-btn-bg);
            color: var(--primary-btn-text);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }
        .primary-btn:hover {
            background-color: var(--primary-btn-hover);
        }
        .primary-btn:active {
            transform: scale(0.97);
        }

        /* テーマ切替ボタン */
        .theme-toggle-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1.5px solid var(--border-strong);
            box-shadow: var(--shadow-card);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .theme-toggle-btn:hover {
            background-color: var(--bg-hover);
        }
        .theme-toggle-btn:active {
            transform: scale(0.95);
        }

        /* 選択肢ボタン */
        .choice-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-card);
            transition: transform 0.08s ease-out, background-color 0.12s ease-out, border-color 0.12s ease-out, opacity 0.15s ease;
        }
        .choice-btn:hover,
        .choice-btn:focus-visible {
            border-color: var(--border-strong);
            background-color: var(--bg-hover);
            outline: none;
        }
        .choice-btn:active {
            transform: scale(0.98);
        }

        /* 正誤フィードバック */
        .is-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
        }
        .is-correct .choice-num {
            color: var(--correct-border) !important;
        }

        .is-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }
        .is-wrong .choice-num {
            color: var(--wrong-border) !important;
        }

        .dimmed {
            opacity: 0.42;
        }

        /* 日本語訳のマーカー強調 */
        .jp-highlight {
            background-color: var(--mark-bg);
            color: var(--mark-text);
            font-weight: 800;
            padding: 0.08em 0.3em;
            border-radius: 0.35em;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        /* ランキング行 */
        .rank-row {
            background-color: var(--bg-subtle);
            border: 1.5px solid transparent;
        }
        .rank-row-highlight {
            background-color: var(--record-bg);
            border: 2px solid var(--record-border);
        }

        /* 画面遷移アニメーション */
        .fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden-screen {
            display: none !important;
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col items-center justify-center overflow-hidden relative">

    <!-- ==================== テーマ切替ボタン（右上固定） ==================== -->
    <button id="theme-toggle-btn" type="button" aria-label="配色テーマを切り替え"
            class="theme-toggle-btn fixed top-3 right-3 sm:top-4 sm:right-4 z-50 px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-full text-xs sm:text-sm font-bold flex items-center gap-1.5">
        <span id="theme-icon">☀️</span>
        <span id="theme-label">ライト</span>
    </button>

    <!-- ==================== スタート画面 ==================== -->
    <div id="start-screen" class="w-full max-w-2xl h-full px-4 pt-12 pb-5 sm:py-8 flex flex-col items-center justify-between text-center fade-in">
        <div class="w-full">
            <p class="text-xs sm:text-sm font-extrabold text-accent tracking-widest mb-1">TARGET 1900 / SECTION 11</p>
            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight">英単語スピードクイズ</h1>
            <p class="text-sm sm:text-lg mt-1.5 text-sub font-semibold">ランダム10問・タイムアタック</p>
        </div>

        <!-- ランキング表示エリア -->
        <div class="w-full card-surface rounded-2xl p-4 my-2">
            <div class="flex justify-between items-center mb-2.5">
                <h2 class="text-base sm:text-lg font-extrabold text-accent">🏆 TOP 3 ランキング</h2>
                <button id="reset-ranking-start" type="button"
                        class="text-xs px-2.5 py-1 rounded-lg border border-current text-sub hover:opacity-80 transition-opacity font-semibold">
                    リセット
                </button>
            </div>
            <div id="start-ranking-list" class="space-y-1.5 text-left text-sm sm:text-base">
                <!-- JSで描画 -->
            </div>
        </div>

        <!-- 操作ガイド -->
        <div class="w-full text-xs sm:text-sm text-sub space-y-1 mb-2">
            <p>選択肢：<strong style="color: var(--text-main);">タップ</strong> または <strong style="color: var(--text-main);">[1]〜[4]</strong> キー</p>
            <p>日本語訳：<strong style="color: var(--text-main);">英文をタップ</strong> または <strong style="color: var(--text-main);">[Space]</strong> キー</p>
        </div>

        <button id="start-btn" type="button"
                class="primary-btn w-full max-w-md py-4 sm:py-5 text-xl sm:text-3xl font-extrabold rounded-2xl shadow-md mb-1">
            スタート (Enter)
        </button>
    </div>

    <!-- ==================== クイズ画面 ==================== -->
    <div id="quiz-screen" class="w-full max-w-4xl h-full px-3 sm:px-6 pt-12 pb-3 sm:pt-14 sm:pb-6 flex flex-col justify-between hidden-screen">
        <!-- ヘッダー（進捗・タイム・スコア） -->
        <div class="flex justify-between items-center px-1 shrink-0">
            <div id="progress-text" class="text-lg sm:text-2xl font-extrabold text-sub">Q. 1 / 10</div>
            <div id="timer-text" class="text-xl sm:text-3xl font-mono font-extrabold text-accent">0.0秒</div>
            <div id="score-text" class="text-lg sm:text-2xl font-extrabold">正解: 0</div>
        </div>

        <!-- 問題文エリア（タップで日本語訳をトグル表示） -->
        <div id="question-area" role="button" tabindex="0" aria-label="英文エリア。タップまたはSpaceキーで日本語訳を表示"
             class="card-surface flex-grow flex flex-col items-center justify-center my-2.5 sm:my-4 px-4 sm:px-7 py-4 rounded-2xl cursor-pointer active:scale-[0.99] transition-transform">
            <!-- 英語例文（最初はこれだけ表示） -->
            <div id="question-en" class="text-xl sm:text-3xl md:text-4xl font-bold text-center leading-snug sm:leading-relaxed w-full">
                English sentence
            </div>

            <!-- 日本語訳ガイド（未表示時に表示） -->
            <div id="jp-hint-guide" class="mt-4 text-xs sm:text-sm text-sub font-semibold rounded-full px-4 py-1"
                 style="background-color: var(--bg-subtle);">
                タップして日本語訳を表示（Spaceキー）
            </div>

            <!-- 日本語例文（タップ後に表示） -->
            <div id="question-ja" class="hidden mt-4 pt-3.5 text-base sm:text-2xl font-bold text-center leading-relaxed w-full"
                 style="border-top: 1.5px solid var(--border-color);">
                日本語の例文
            </div>
        </div>

        <!-- 選択肢（スマホ1列、タブレット以上2列） -->
        <div id="choices-container" class="grid grid-cols-1 md:grid-cols-2 gap-2.5 sm:gap-3.5 shrink-0 pb-1">
            <!-- ボタンはJSで生成 -->
        </div>
    </div>

    <!-- ==================== 結果画面 ==================== -->
    <div id="result-screen" class="w-full max-w-2xl h-full px-4 pt-12 pb-5 sm:py-8 flex flex-col items-center justify-between text-center hidden-screen">
        <div class="w-full">
            <div id="new-record-badge" class="hidden inline-block px-4 py-1 mb-2 rounded-full font-extrabold text-xs sm:text-sm tracking-wider animate-pulse"
                 style="background-color: var(--mark-bg); color: var(--mark-text);">
                ★ NEW RECORD! TOP 3 入り ★
            </div>
            <h2 class="text-2xl sm:text-4xl font-extrabold">結果発表</h2>
            <div class="flex items-baseline justify-center gap-6 sm:gap-10 mt-3">
                <div>
                    <p class="text-xs sm:text-sm text-sub font-bold">正解数</p>
                    <div id="final-score" class="text-4xl sm:text-6xl font-extrabold text-accent">10 / 10</div>
                </div>
                <div>
                    <p class="text-xs sm:text-sm text-sub font-bold">タイム</p>
                    <div id="final-time" class="text-3xl sm:text-5xl font-mono font-extrabold">12.4秒</div>
                </div>
            </div>
            <p id="result-message" class="text-base sm:text-xl font-bold text-sub mt-2"></p>
        </div>

        <!-- ランキング表示エリア -->
        <div class="w-full card-surface rounded-2xl p-4 my-2">
            <div class="flex justify-between items-center mb-2.5">
                <h3 class="text-base sm:text-lg font-extrabold text-accent">🏆 TOP 3 ランキング</h3>
                <button id="reset-ranking-result" type="button"
                        class="text-xs px-2.5 py-1 rounded-lg border border-current text-sub hover:opacity-80 transition-opacity font-semibold">
                    リセット
                </button>
            </div>
            <div id="result-ranking-list" class="space-y-1.5 text-left text-sm sm:text-base">
                <!-- JSで描画 -->
            </div>
        </div>

        <button id="retry-btn" type="button"
                class="primary-btn w-full max-w-md py-4 sm:py-5 text-xl sm:text-3xl font-extrabold rounded-2xl shadow-md mb-1">
            もう一度 (Enter)
        </button>
    </div>

    <script>
        // ==================== 出題データ（全30問） ====================
        const ALL_QUESTIONS = [
            { en: "I will ( ) with the client about the delivery date.", ans: "negotiate", choices: ["negotiate", "navigate", "nominate", "neglect"], jp: "私が納期に関して顧客と**交渉します**。" },
            { en: "Yesterday, I ( ) some new apps on my smartphone.", ans: "installed", choices: ["installed", "insisted", "inspired", "instructed"], jp: "昨日私はスマートフォンに新しいアプリをいくつか**インストールした**。" },
            { en: "Loud music always ( ) me from reading.", ans: "distracts", choices: ["distracts", "attracts", "extracts", "contracts"], jp: "大音量の音楽はいつも私の気を読書から**そらす**。" },
            { en: "We were ( ) at the surprise visit of the famous actor.", ans: "astonished", choices: ["astonished", "thrilled", "abolished", "accomplished"], jp: "私たちは有名な俳優の突然の訪問に**驚いた**。" },
            { en: "The typhoon destroyed much of the city's ( ).", ans: "infrastructure", choices: ["infrastructure", "instruction", "instrument", "architecture"], jp: "その台風は市の**インフラ**の多くを破壊した。" },
            { en: "He faced a heavy ( ) for kidnapping.", ans: "penalty", choices: ["penalty", "plenty", "property", "poverty"], jp: "彼は誘拐に対して重い**刑罰**を科せられた。" },
            { en: "Some aging patients with ( ) go missing when they are out alone.", ans: "dementia", choices: ["dementia", "dimension", "democracy", "departure"], jp: "**認知症**の高齢患者の中には1人で外出すると行方不明になる人がいる。" },
            { en: "I am really ( ) to you and your family for your hospitality.", ans: "grateful", choices: ["grateful", "graceful", "great", "greedy"], jp: "私はあなたとあなたのご家族の親切なおもてなしに本当に**感謝して**います。" },
            { en: "Tokyo spent a ( ) amount of money on moving its fish market.", ans: "tremendous", choices: ["tremendous", "brilliant", "generous", "dangerous"], jp: "東京都は魚市場を移転することに**莫大な**金額を費やした。" },
            { en: "Suddenly, heavy rain hit the town ( ) with lightning.", ans: "simultaneously", choices: ["simultaneously", "similarly", "sincerely", "spontaneously"], jp: "突然、雷と**同時に**大雨が町を襲った。" },
            { en: "The military ( ) the citizens of their liberty.", ans: "deprived", choices: ["deprived", "derived", "desired", "deserved"], jp: "軍隊は国民から自由を**奪った**。" },
            { en: "Teachers have a good chance to ( ) their students' thinking ability.", ans: "foster", choices: ["foster", "flourish", "force", "flatter"], jp: "教師は生徒の考える力を**はぐくむ**よい機会を持っている。" },
            { en: "He made an ( ) plan to climb Mont Blanc.", ans: "elaborate", choices: ["elaborate", "elevate", "eliminate", "evaluate"], jp: "彼はモンブランに登る**入念な**計画を立てた。" },
            { en: "All logical arguments have two ( ) and a conclusion.", ans: "premises", choices: ["premises", "privileges", "promises", "practices"], jp: "論理的な主張はすべて2つの**前提**と1つの結論を備えている。" },
            { en: "He has a deep interest in ( ) European history.", ans: "medieval", choices: ["medieval", "moderate", "medical", "mutual"], jp: "彼は**中世**ヨーロッパ史に深い関心を抱いている。" },
            { en: "He ( ) some important facts during his research.", ans: "overlooked", choices: ["overlooked", "overcame", "overtook", "overwhelmed"], jp: "彼は研究の中でいくつかの重要な事実を**見落とした**。" },
            { en: "The best way to relieve your ( ) is to have sufficient sleep.", ans: "fatigue", choices: ["fatigue", "figure", "failure", "feature"], jp: "**疲労**を和らげる最善の方法は十分な睡眠をとることである。" },
            { en: "After her remark, there was an ( ) silence.", ans: "awkward", choices: ["awkward", "aware", "upward", "outward"], jp: "彼女の発言の後、**気まずい**沈黙があった。" },
            { en: "Organic foods are produced without chemical ( ).", ans: "pesticides", choices: ["pesticides", "parasites", "perspectives", "procedures"], jp: "有機食品は化学**殺虫剤**を使わずに作られる。" },
            { en: "The actress described her ( ) relationship with her husband.", ans: "intimate", choices: ["intimate", "inferior", "imitate", "infinite"], jp: "その女優は夫との**親密な**関係について述べた。" },
            { en: "The children were able to ( ) the new ideas from the lesson.", ans: "grasp", choices: ["grasp", "gasp", "graph", "grant"], jp: "子供たちはその課に出てきた新しい考えを**理解す**ることができた。" },
            { en: "The counselor taught me some ways to ( ) anxiety.", ans: "diminish", choices: ["diminish", "distinguish", "dismiss", "distribute"], jp: "カウンセラーは私に不安を**減らす**ためのいくつかの方法を教えてくれた。" },
            { en: "Electron microscopes allow us to investigate organic ( ).", ans: "molecules", choices: ["molecules", "muscles", "miracles", "manuals"], jp: "電子顕微鏡は私たちが有機**分子**を調べるのを可能にする。" },
            { en: "After receiving a ( ) from his teacher, he smiled back.", ans: "compliment", choices: ["compliment", "complement", "complaint", "component"], jp: "先生から**賛辞**を受けた後、彼はほほえみを返した。" },
            { en: "Children can walk around in the ( ) end of the pool.", ans: "shallow", choices: ["shallow", "shadow", "swallow", "sorrow"], jp: "子供たちはプールの**浅い**ほうの端で歩き回ることができる。" },
            { en: "Tax was ( ) from the price.", ans: "excluded", choices: ["excluded", "included", "concluded", "exploded"], jp: "税金は価格から**除外され**ていた。" },
            { en: "I ( ) the reviews that said the movie was good.", ans: "disputed", choices: ["disputed", "distributed", "disposed", "displayed"], jp: "私はその映画がすぐれていると言っている批評に**異議を唱えた**。" },
            { en: "The village was severely damaged by heavy rains and ( ) floods.", ans: "subsequent", choices: ["subsequent", "sufficient", "substantial", "subtle"], jp: "村は豪雨と**その後の**洪水によって大きな損害を受けた。" },
            { en: "Using your creative ( ) might help you solve the problem.", ans: "faculties", choices: ["faculties", "facilities", "factors", "features"], jp: "創造**力**を使うことはあなたがその問題を解決する助けになるかもしれない。" },
            { en: "A trial by ( ) is a standard practice in America.", ans: "jury", choices: ["jury", "judge", "journey", "justice"], jp: "アメリカでは**陪審**による裁判が標準的な慣習である。" }
        ];

        // ==================== 定数・状態管理 ====================
        const QUESTIONS_PER_GAME = 10;
        const RANKING_KEY = 'target1900_sec11_top3_ranking_v1';
        const THEME_KEY = 'target1900_sec11_theme_v1';

        const THEMES = [
            { id: 'light', icon: '☀️', label: 'ライト' },
            { id: 'sepia', icon: '📖', label: 'セピア' },
            { id: 'dark',  icon: '🌙', label: 'ダーク' }
        ];

        let currentThemeIndex = 0;
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswering = false;
        let currentChoices = [];
        let isJapaneseVisible = false;

        // タイマー管理
        let startTime = 0;
        let elapsedSeconds = 0;
        let timerInterval = null;

        // リセットボタン2段階確認用
        const resetConfirmTimers = {};

        // ==================== DOM要素 ====================
        const screens = {
            start: document.getElementById('start-screen'),
            quiz: document.getElementById('quiz-screen'),
            result: document.getElementById('result-screen')
        };

        const elems = {
            themeBtn: document.getElementById('theme-toggle-btn'),
            themeIcon: document.getElementById('theme-icon'),
            themeLabel: document.getElementById('theme-label'),
            progress: document.getElementById('progress-text'),
            timer: document.getElementById('timer-text'),
            score: document.getElementById('score-text'),
            questionArea: document.getElementById('question-area'),
            questionEn: document.getElementById('question-en'),
            jpHintGuide: document.getElementById('jp-hint-guide'),
            questionJa: document.getElementById('question-ja'),
            choices: document.getElementById('choices-container'),
            finalScore: document.getElementById('final-score'),
            finalTime: document.getElementById('final-time'),
            resultMessage: document.getElementById('result-message'),
            newRecordBadge: document.getElementById('new-record-badge'),
            startRankingList: document.getElementById('start-ranking-list'),
            resultRankingList: document.getElementById('result-ranking-list')
        };

        // ==================== テーマ管理 (localStorage) ====================
        function applyTheme(index) {
            currentThemeIndex = index % THEMES.length;
            const theme = THEMES[currentThemeIndex];
            document.documentElement.setAttribute('data-theme', theme.id);
            elems.themeIcon.textContent = theme.icon;
            elems.themeLabel.textContent = theme.label;
            try {
                localStorage.setItem(THEME_KEY, theme.id);
            } catch (e) {
                // ストレージ制限時は無視
            }
        }

        function initTheme() {
            try {
                const saved = localStorage.getItem(THEME_KEY);
                const foundIndex = THEMES.findIndex(t => t.id === saved);
                applyTheme(foundIndex >= 0 ? foundIndex : 0);
            } catch (e) {
                applyTheme(0);
            }
        }

        // ==================== ユーティリティ ====================
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function formatJapanese(jpText) {
            return jpText.replace(/\*\*(.*?)\*\*/g, '<span class="jp-highlight">$1</span>');
        }

        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden-screen'));
            screens[screenName].classList.remove('hidden-screen');
            screens[screenName].classList.remove('fade-in');
            void screens[screenName].offsetWidth;
            screens[screenName].classList.add('fade-in');
        }

        // ==================== ランキング機能 ====================
        function loadRanking() {
            try {
                const raw = localStorage.getItem(RANKING_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveRanking(ranking) {
            try {
                localStorage.setItem(RANKING_KEY, JSON.stringify(ranking));
            } catch (e) {}
        }

        function recordResult(finalScore, finalTimeSec) {
            const ranking = loadRanking();
            const newEntry = {
                id: Date.now() + Math.random(),
                score: finalScore,
                time: Number(finalTimeSec.toFixed(1))
            };
            ranking.push(newEntry);

            ranking.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.time - b.time;
            });

            const top3 = ranking.slice(0, 3);
            saveRanking(top3);

            const isNewRecord = top3.some(item => item.id === newEntry.id);
            return { top3, isNewRecord, newEntryId: newEntry.id };
        }

        function renderRanking(containerEl, highlightId = null) {
            const ranking = loadRanking();
            const medals = ['🥇 1位', '🥈 2位', '🥉 3位'];

            if (ranking.length === 0) {
                containerEl.innerHTML = `<p class="text-center text-sub py-3 text-sm">まだ記録がありません</p>`;
                return;
            }

            containerEl.innerHTML = [0, 1, 2].map(idx => {
                const item = ranking[idx];
                if (!item) {
                    return `
                        <div class="rank-row flex justify-between items-center px-3 py-1.5 rounded-xl text-sub opacity-60">
                            <span class="font-bold">${medals[idx]}</span>
                            <span>---</span>
                        </div>
                    `;
                }
                const isHighlight = highlightId !== null && item.id === highlightId;
                const rowClass = isHighlight ? 'rank-row-highlight' : 'rank-row';

                return `
                    <div class="${rowClass} flex justify-between items-center px-3 py-1.5 rounded-xl">
                        <span class="font-bold ${isHighlight ? 'text-accent' : ''}">${medals[idx]}</span>
                        <div class="flex items-center gap-4 font-mono">
                            <span class="font-extrabold text-accent">${item.score} / ${QUESTIONS_PER_GAME}</span>
                            <span class="font-bold w-16 text-right">${item.time.toFixed(1)}秒</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleResetClick(btnEl) {
            const btnId = btnEl.id;
            if (btnEl.dataset.confirming === 'true') {
                clearTimeout(resetConfirmTimers[btnId]);
                btnEl.dataset.confirming = 'false';
                btnEl.textContent = 'リセット';
                btnEl.style.backgroundColor = '';
                btnEl.style.color = '';
                btnEl.style.borderColor = '';

                saveRanking([]);
                renderRanking(elems.startRankingList);
                renderRanking(elems.resultRankingList);
            } else {
                btnEl.dataset.confirming = 'true';
                btnEl.textContent = '本当に消す？';
                btnEl.style.backgroundColor = 'var(--wrong-bg)';
                btnEl.style.color = 'var(--wrong-text)';
                btnEl.style.borderColor = 'var(--wrong-border)';

                resetConfirmTimers[btnId] = setTimeout(() => {
                    btnEl.dataset.confirming = 'false';
                    btnEl.textContent = 'リセット';
                    btnEl.style.backgroundColor = '';
                    btnEl.style.color = '';
                    btnEl.style.borderColor = '';
                }, 3000);
            }
        }

        // ==================== タイマー機能 ====================
        function startTimer() {
            stopTimer();
            startTime = performance.now();
            elapsedSeconds = 0;
            elems.timer.textContent = '0.0秒';

            timerInterval = setInterval(() => {
                elapsedSeconds = (performance.now() - startTime) / 1000;
                elems.timer.textContent = `${elapsedSeconds.toFixed(1)}秒`;
            }, 100);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (startTime > 0) {
                elapsedSeconds = (performance.now() - startTime) / 1000;
                elems.timer.textContent = `${elapsedSeconds.toFixed(1)}秒`;
            }
        }

        // ==================== 日本語訳の表示切替 ====================
        function setJapaneseVisibility(visible) {
            isJapaneseVisible = visible;
            if (visible) {
                elems.questionJa.classList.remove('hidden');
                elems.jpHintGuide.classList.add('hidden');
            } else {
                elems.questionJa.classList.add('hidden');
                elems.jpHintGuide.classList.remove('hidden');
            }
        }

        function toggleJapanese() {
            if (screens.quiz.classList.contains('hidden-screen')) return;
            setJapaneseVisibility(!isJapaneseVisible);
        }

        // ==================== ゲーム進行ロジック ====================
        function startGame() {
            currentQuestions = shuffleArray(ALL_QUESTIONS).slice(0, QUESTIONS_PER_GAME);
            currentQuestionIndex = 0;
            score = 0;

            showScreen('quiz');
            loadQuestion();
            startTimer();
        }

        function loadQuestion() {
            isAnswering = false;
            const currentQ = currentQuestions[currentQuestionIndex];

            elems.progress.textContent = `Q. ${currentQuestionIndex + 1} / ${QUESTIONS_PER_GAME}`;
            elems.score.textContent = `正解: ${score}`;

            elems.questionEn.textContent = currentQ.en;
            elems.questionJa.innerHTML = formatJapanese(currentQ.jp);
            setJapaneseVisibility(false);

            currentChoices = shuffleArray(currentQ.choices);
            elems.choices.innerHTML = '';

            currentChoices.forEach((choiceWord, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "choice-btn w-full text-left px-4 py-3.5 sm:px-6 sm:py-5 rounded-2xl flex items-center";
                btn.innerHTML = `
                    <span class="choice-num text-lg sm:text-2xl font-extrabold text-sub mr-4 w-7 shrink-0 text-center">${index + 1}</span>
                    <span class="text-xl sm:text-3xl font-bold break-all">${choiceWord}</span>
                `;
                btn.addEventListener('click', () => handleAnswer(index));
                elems.choices.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex) {
            if (isAnswering) return;
            isAnswering = true;

            const currentQ = currentQuestions[currentQuestionIndex];
            const buttons = elems.choices.children;
            const isCorrect = currentChoices[selectedIndex] === currentQ.ans;

            if (isCorrect) score++;

            if (currentQuestionIndex === QUESTIONS_PER_GAME - 1) {
                stopTimer();
            }

            for (let i = 0; i < buttons.length; i++) {
                if (currentChoices[i] === currentQ.ans) {
                    buttons[i].classList.add('is-correct');
                } else if (i === selectedIndex && !isCorrect) {
                    buttons[i].classList.add('is-wrong');
                } else {
                    buttons[i].classList.add('dimmed');
                }
            }

            if (!isCorrect) {
                setJapaneseVisibility(true);
            }

            elems.score.textContent = `正解: ${score}`;

            const delayMs = isCorrect ? 700 : 2000;
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < QUESTIONS_PER_GAME) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, delayMs);
        }

        function showResult() {
            showScreen('result');

            elems.finalScore.textContent = `${score} / ${QUESTIONS_PER_GAME}`;
            elems.finalTime.textContent = `${elapsedSeconds.toFixed(1)}秒`;

            let message = '';
            if (score === QUESTIONS_PER_GAME) message = 'Perfect! 完璧なスピードと正確さ！';
            else if (score >= 8) message = 'Excellent! 素晴らしい！';
            else if (score >= 5) message = 'Good job! その調子！';
            else message = 'Keep trying! もう一度チャレンジ！';
            elems.resultMessage.textContent = message;

            const { isNewRecord, newEntryId } = recordResult(score, elapsedSeconds);
            if (isNewRecord) {
                elems.newRecordBadge.classList.remove('hidden');
            } else {
                elems.newRecordBadge.classList.add('hidden');
            }
            renderRanking(elems.resultRankingList, isNewRecord ? newEntryId : null);
        }

        // ==================== イベントリスナー ====================
        elems.themeBtn.addEventListener('click', () => applyTheme(currentThemeIndex + 1));
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('retry-btn').addEventListener('click', startGame);
        elems.questionArea.addEventListener('click', toggleJapanese);

        document.getElementById('reset-ranking-start').addEventListener('click', (e) => handleResetClick(e.currentTarget));
        document.getElementById('reset-ranking-result').addEventListener('click', (e) => handleResetClick(e.currentTarget));

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (!screens.start.classList.contains('hidden-screen') || !screens.result.classList.contains('hidden-screen')) {
                    e.preventDefault();
                    startGame();
                }
                return;
            }

            if (!screens.quiz.classList.contains('hidden-screen')) {
                if (e.code === 'Space' || e.key === ' ') {
                    e.preventDefault();
                    toggleJapanese();
                    return;
                }

                if (!isAnswering) {
                    const keyNum = parseInt(e.key, 10);
                    if (keyNum >= 1 && keyNum <= 4) {
                        handleAnswer(keyNum - 1);
                    }
                }
            }
        });

        // 初期化
        initTheme();
        renderRanking(elems.startRankingList);
    </script>
</body>
</html>
